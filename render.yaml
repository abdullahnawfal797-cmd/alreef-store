services:
  - type: web
    name: alreef-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alreef-db
          property: connectionString

databases:
  - name: alreef-db
    plan: free
    databaseName: alreef_store
    user: alreef_admin
